name: Upload verified release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag
        required: true
        type: string
      verified_run:
        description: Successful Verify run for the draft target commit
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
      VERIFIED_RUN: ${{ inputs.verified_run }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the verified source and draft
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha$ ]]
          [[ "$VERIFIED_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$VERIFIED_RUN" > /tmp/verified-run.json
          gh release view "$RELEASE_TAG" --json isDraft,targetCommitish > /tmp/draft.json
          python3 - <<'PY'
          import json
          run = json.load(open('/tmp/verified-run.json'))
          draft = json.load(open('/tmp/draft.json'))
          assert run['conclusion'] == 'success', 'Verify must pass before upload'
          assert run['path'] == '.github/workflows/verify.yml', 'Use the Verify workflow'
          assert draft['isDraft'], 'Only draft releases accept replacement assets'
          assert run['head_sha'] == draft['targetCommitish'], 'Draft and verified source differ'
          PY
      - uses: actions/download-artifact@v4
        with:
          name: applied-intelligence-neoforge
          path: build/libs
          run-id: ${{ inputs.verified_run }}
          github-token: ${{ github.token }}
      - name: Check notices and upload the JAR
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_release.py
          sha256sum build/libs/*-mc1.21.1-neoforge.jar
          gh release upload "$RELEASE_TAG" build/libs/*-mc1.21.1-neoforge.jar --clobber
