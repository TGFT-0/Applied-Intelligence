name: Release
on:
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes (Markdown)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      filename: ${{ steps.metadata.outputs.filename }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - run: ./gradlew build
      - run: python3 tools/verify_release.py
      - run: ./gradlew -p prototypes/secure-transport test
      - id: metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          version = re.search(r"^version = '([^']+)'", pathlib.Path('build.gradle').read_text(), re.M)[1]
          if not re.fullmatch(r'\d+\.\d+\.\d+-alpha', version):
              raise SystemExit('This workflow publishes alpha releases only')
          filename = f'applied-intelligence-{version}-mc1.21.1-neoforge.jar'
          if not pathlib.Path('build/libs', filename).is_file():
              raise SystemExit('Verified release JAR missing')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\nfilename={filename}\n')
          PY
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: verified-release
          path: build/libs/${{ steps.metadata.outputs.filename }}
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: verified-release
          path: release
      - name: Publish verified JAR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_FILENAME: ${{ needs.build.outputs.filename }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Release already exists. Existing assets require a separate review.' >&2
            exit 1
          fi
          printf '%s\n' "$RELEASE_NOTES" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$tag" "release/$RELEASE_FILENAME" \
            --target "$GITHUB_SHA" --prerelease --title "$RELEASE_VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
