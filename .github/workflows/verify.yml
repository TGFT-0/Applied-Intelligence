name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  mod:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - run: ./gradlew build
      - run: python3 tools/verify_release.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: applied-intelligence-neoforge
          path: build/libs/*-mc1.21.1-neoforge.jar
          if-no-files-found: error
  transport-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - run: ./gradlew -p prototypes/secure-transport test
