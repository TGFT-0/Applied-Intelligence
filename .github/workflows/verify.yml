name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build
      - run: python3 tools/verify_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: applied-intelligence-neoforge
          path: build/libs/*-mc1.21.1-neoforge.jar
  transport-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -p prototypes/secure-transport test
