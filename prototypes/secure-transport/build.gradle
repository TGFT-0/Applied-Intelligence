plugins { id 'java' }
group = 'dev.tgft.appliedintelligence.prototype'
version = '0.1-prototype'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories { mavenCentral() }
dependencies {
    implementation 'org.eclipse.jetty:jetty-server:12.1.15'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.87'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.23.0'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.17'
}
dependencyLocking { lockAllConfigurations(); lockMode = LockMode.STRICT }
test { useJUnitPlatform(); maxHeapSize = '512m'; timeout = Duration.ofMinutes(2); systemProperty 'org.slf4j.simpleLogger.defaultLogLevel', 'off' }
// Tests create loopback endpoints explicitly. There is no launcher or distributable host.
jar { enabled = false }
tasks.register('resolveAll') {
    doLast { configurations.findAll { it.canBeResolved }.each { it.resolve() } }
}
